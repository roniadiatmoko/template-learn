<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password: Learnzie</title>
  <meta name="description" content="Reset your Learnzie password.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/theme.css" rel="stylesheet">
  <link href="assets/css/bootstrap-skin.css" rel="stylesheet">
  <link href="assets/css/courses.css" rel="stylesheet">
  <link href="assets/css/public.css" rel="stylesheet">
  <script src="assets/js/theme-init.js"></script>
</head>
<body class="public" data-layout="public" data-page="forgot" data-root="">
  <header data-slot="public-header"></header>

  <main>

    <div class="pub-container auth-wrap">
      <div class="auth-card" style="max-width:520px;grid-template-columns:1fr">
        <div class="auth-form">
          <form id="forgotForm" novalidate>
            <h1>Reset your password</h1>
            <p class="sub">Enter the email you signed up with. We will send you a link to choose a new password.</p>
            <div class="mb-4"><label class="form-label" for="email">Email</label><input id="email" type="email" class="form-control" autocomplete="email" placeholder="name@email.com" required><div class="invalid-feedback">Enter a valid email address.</div></div>
            <button class="btn btn-primary w-100 btn-lg" type="submit">Send reset link</button>
            <p class="auth-alt"><a href="login.html"><i class="bi bi-arrow-left me-1"></i>Back to log in</a></p>
          </form>
          <div id="forgotDone" hidden tabindex="-1" role="status">
            <span class="lz-icon-box green mb-3"><i class="bi bi-envelope-check"></i></span>
            <h1>Check your email</h1>
            <p class="sub">If an account exists for <b id="sentTo"></b>, we sent a link to reset your password. It may take a few minutes to arrive.</p>
            <a class="btn btn-primary w-100 btn-lg" href="login.html">Back to log in</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer data-slot="public-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data/mock.js"></script>
  <script src="assets/js/lz.js"></script>
  <script src="assets/js/public.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
