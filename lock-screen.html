<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lock screen: Learnzie</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/theme.css" rel="stylesheet">
  <link href="assets/css/bootstrap-skin.css" rel="stylesheet">
  <link href="assets/css/courses.css" rel="stylesheet">
  <link href="assets/css/public.css" rel="stylesheet">
  <script src="assets/js/theme-init.js"></script>
</head>
<body class="public bare" data-layout="public" data-page="lock" data-root="">
  <main>

    <div class="bare-wrap"><div class="bare-card" style="max-width:440px">
      <a class="brand" href="landing.html"><span class="brand-mark"></span>Learnzie</a>
      <span class="lz-avatar lock-avatar" id="lockAvatar">GC</span>
      <h1 id="lockName">Gareth Christopher</h1>
      <p class="sub">Your session is locked. Enter your password to continue.</p>
      <form id="lockForm" novalidate>
        <label class="form-label" for="password">Password</label>
        <div class="pw-field mb-3"><input id="password" type="password" class="form-control" autocomplete="current-password" required><button class="pw-toggle" type="button" aria-label="Show password" aria-pressed="false"><i class="bi bi-eye"></i></button><div class="invalid-feedback">Enter your password.</div></div>
        <button class="btn btn-primary w-100 btn-lg" type="submit"><i class="bi bi-unlock me-1"></i>Unlock</button>
        <p class="form-text text-center mt-3 mb-0">Demo: any password will unlock.</p>
      </form>
      <div class="bare-foot">Not you? <a href="login.html">Log in with another account</a></div>
    </div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data/mock.js"></script>
  <script src="assets/js/lz.js"></script>
  <script src="assets/js/public.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/public-pages.js"></script>
</body>
</html>
