<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics — Learnzie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-skin.css" rel="stylesheet">
  <link href="../assets/css/courses.css" rel="stylesheet">
  <link href="../assets/css/pages.css" rel="stylesheet">
  <script src="../assets/js/theme-init.js"></script>
</head>
<body data-page="analytics" data-title="Analytics" data-root="../">
  <div class="app-shell no-right">
    <aside data-slot="sidebar"></aside>
    <main class="app-main">
      <header data-slot="header"></header>
      <div class="app-content">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <p class="text-muted mb-0">Your learning activity over time.</p>
          <select id="range" class="form-select select-sm" aria-label="Period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select>
        </div>
        <div class="row g-3 mb-3" id="kpis"></div>
        <div class="row g-3 mb-3">
          <div class="col-lg-8"><section class="lz-card"><div class="lz-card-head"><h3 class="lz-card-title">Study time</h3><span class="text-muted small">hours per day</span></div><div class="chart-lg"><canvas id="trend" role="img" aria-label="Study hours per day"></canvas></div></section></div>
          <div class="col-lg-4"><section class="lz-card"><div class="lz-card-head"><h3 class="lz-card-title">By category</h3></div><div class="chart-md"><canvas id="mix" role="img" aria-label="Study time by category"></canvas></div><div class="legend justify-content-center mt-3" id="mixLegend"></div></section></div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-lg-5"><section class="lz-card"><div class="lz-card-head"><h3 class="lz-card-title">Tasks per week</h3></div><div class="chart-md"><canvas id="weeks" role="img" aria-label="Completed tasks per week"></canvas></div></section></div>
          <div class="col-lg-7"><section class="lz-card"><div class="lz-card-head"><h3 class="lz-card-title">Top courses</h3></div>
            <div data-lz-table data-page-size="5"><div class="lz-table table-responsive"><table class="table"><thead><tr><th data-sort>Course</th><th data-sort>Category</th><th data-sort>Hours</th><th data-sort>Progress</th></tr></thead><tbody id="topBody"></tbody></table></div><div data-lz-pager class="mt-2"></div></div>
          </section></div>
        </div>
      </div>
      <footer data-slot="footer"></footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="../assets/js/data/mock.js"></script>
  <script src="../assets/js/data/curriculum.js"></script>
  <script src="../assets/js/lz.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/analytics.js"></script>
</body>
</html>
