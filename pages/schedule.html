<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule — Learnzie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-skin.css" rel="stylesheet">
  <link href="../assets/css/courses.css" rel="stylesheet">
  <link href="../assets/css/pages.css" rel="stylesheet">
  <script src="../assets/js/theme-init.js"></script>
</head>
<body data-page="schedule" data-title="Schedule" data-root="../">
  <div class="app-shell no-right">
    <aside data-slot="sidebar"></aside>
    <main class="app-main">
      <header data-slot="header"></header>
      <div class="app-content">

        <div class="row g-3">
          <div class="col-xl-8">
            <section class="lz-card cal-card">
              <div class="cal-bar">
                <div class="d-flex align-items-center gap-2">
                  <button class="btn-icon btn-icon-sm" id="prev" type="button" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
                  <h2 id="calTitle" aria-live="polite"></h2>
                  <button class="btn-icon btn-icon-sm" id="next" type="button" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                  <button class="btn btn-secondary btn-sm" id="todayBtn" type="button">Today</button>
                  <div class="btn-group btn-group-sm" role="group" aria-label="View">
                    <button class="btn btn-secondary active" data-mode="month" aria-pressed="true" type="button">Month</button>
                    <button class="btn btn-secondary" data-mode="week" aria-pressed="false" type="button">Week</button>
                  </div>
                  <button class="btn btn-primary btn-sm" data-add type="button"><i class="bi bi-plus-lg me-1"></i>Add event</button>
                </div>
              </div>
              <div id="calGrid" class="cal-full month"></div>
              <p class="form-text mt-2 mb-0">Click a day to see its events. Double-click a day to add one.</p>
            </section>
          </div>
          <div class="col-xl-4">
            <section class="lz-card h-auto mb-3">
              <div class="lz-card-head"><h3 class="lz-card-title" id="dayTitle"></h3><button class="btn btn-soft btn-sm" data-add type="button"><i class="bi bi-plus-lg"></i><span class="visually-hidden">Add event</span></button></div>
              <div id="dayList"></div>
            </section>
            <section class="lz-card h-auto">
              <div class="lz-card-head"><h3 class="lz-card-title">Upcoming</h3></div>
              <div id="upcoming"></div>
            </section>
          </div>
        </div>
      </div>
      <footer data-slot="footer"></footer>
    </main>
  </div>

  <div class="modal fade" id="evModal" tabindex="-1" aria-labelledby="evModalTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="evForm" novalidate>
    <div class="modal-header"><h5 class="modal-title" id="evModalTitle">Add event</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label" for="evTitle">Title</label><input id="evTitle" name="title" class="form-control" required maxlength="80" placeholder="e.g. Business Strategy Quiz"><div class="invalid-feedback">Enter a title.</div></div>
      <div class="row g-3 mb-3">
        <div class="col-12"><label class="form-label" for="evDate">Date</label><input id="evDate" name="date" type="date" class="form-control" required><div class="invalid-feedback">Choose a date.</div></div>
        <div class="col-6"><label class="form-label" for="evStart">Start</label><input id="evStart" name="start" type="time" class="form-control" required></div>
        <div class="col-6"><label class="form-label" for="evEnd">End</label><input id="evEnd" name="end" type="time" class="form-control" required><div class="invalid-feedback" id="endError">Choose an end time.</div></div>
      </div>
      <div class="mb-3"><span class="form-label d-block" id="toneLabel">Color</span>
        <div class="tone-pick" role="radiogroup" aria-labelledby="toneLabel">
          <input class="btn-check" type="radio" name="tone" id="tn1" value="blue"><label class="t-blue" for="tn1"><span class="visually-hidden">Blue</span></label>
          <input class="btn-check" type="radio" name="tone" id="tn2" value="pink"><label class="t-pink" for="tn2"><span class="visually-hidden">Pink</span></label>
          <input class="btn-check" type="radio" name="tone" id="tn3" value="yellow"><label class="t-yellow" for="tn3"><span class="visually-hidden">Yellow</span></label>
          <input class="btn-check" type="radio" name="tone" id="tn4" value="green"><label class="t-green" for="tn4"><span class="visually-hidden">Green</span></label>
        </div></div>
      <div><label class="form-label" for="evNote">Note <span class="text-muted fw-normal">(optional)</span></label><textarea id="evNote" name="note" class="form-control" rows="2" maxlength="160"></textarea></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-danger me-auto d-none" id="evDelete">Delete</button><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save event</button></div>
  </form></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data/mock.js"></script>
  <script src="../assets/js/data/curriculum.js"></script>
  <script src="../assets/js/lz.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/schedule.js"></script>
</body>
</html>
