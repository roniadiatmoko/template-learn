<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — Learnzie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-skin.css" rel="stylesheet">
  <link href="../assets/css/courses.css" rel="stylesheet">
  <link href="../assets/css/pages.css" rel="stylesheet">
  <script src="../assets/js/theme-init.js"></script>
</head>
<body data-page="pages" data-title="Profile" data-root="../">
  <div class="app-shell no-right">
    <aside data-slot="sidebar"></aside>
    <main class="app-main">
      <header data-slot="header"></header>
      <div class="app-content">

        <div class="profile-cover" aria-hidden="true"></div>
        <div class="profile-head">
          <span class="lz-avatar" id="profAvatar">GC</span>
          <div><h1 id="profName">Gareth Christopher</h1><div class="handle" id="profHandle"></div></div>
          <div class="profile-stats" id="profStats"></div>
        </div>
        <div class="row g-3">
          <div class="col-lg-4">
            <section class="lz-card"><h2 class="lz-card-title mb-3">About</h2>
              <p id="profBio" class="mb-3"></p>
              <ul class="detail-list">
                <li><i class="bi bi-envelope"></i><span id="profEmail"></span></li>
                <li><i class="bi bi-geo-alt"></i><span>Surakarta, Indonesia</span></li>
                <li><i class="bi bi-calendar3"></i><span>Joined September 2026</span></li>
              </ul>
              <div class="chips mt-3 mb-0" id="profSkills"></div>
              <button class="btn btn-secondary w-100 mt-3" type="button" id="profEdit"><i class="bi bi-pencil me-1"></i>Edit profile</button>
            </section>
          </div>
          <div class="col-lg-8">
            <section class="lz-card">
              <ul class="nav nav-tabs mb-3" role="tablist">
                <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pf-courses" type="button" role="tab">Courses</button></li>
                <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#pf-activity" type="button" role="tab">Activity</button></li>
              </ul>
              <div class="tab-content">
                <div class="tab-pane fade show active" id="pf-courses" role="tabpanel"><div id="profCourses"></div></div>
                <div class="tab-pane fade" id="pf-activity" role="tabpanel"><div class="timeline" style="background:transparent;padding:0"><div id="profActivity"></div></div></div>
              </div>
            </section>
          </div>
        </div>
      </div>
      <footer data-slot="footer"></footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data/mock.js"></script>
  <script src="../assets/js/data/curriculum.js"></script>
  <script src="../assets/js/lz.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/examples.js"></script>
</body>
</html>
