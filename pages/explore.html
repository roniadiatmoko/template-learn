<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore — Learnzie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-skin.css" rel="stylesheet">
  <link href="../assets/css/courses.css" rel="stylesheet">
  <script src="../assets/js/theme-init.js"></script>
</head>
<body data-page="explore" data-title="Explore" data-root="../">
  <div class="app-shell no-right">
    <aside data-slot="sidebar"></aside>
    <main class="app-main">
      <header data-slot="header"></header>
      <div class="app-content">
        <div class="toolbar">
          <div class="search-box"><i class="bi bi-search"></i><input id="q" class="form-control" placeholder="Search course, instructor, topic" aria-label="Search courses"></div>
          <div class="d-flex gap-2 flex-wrap">
            <select id="level" class="form-select" aria-label="Level">
              <option value="all">All levels</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option>
            </select>
            <select id="sort" class="form-select" aria-label="Sort by">
              <option value="popular">Most popular</option><option value="rating">Highest rated</option><option value="newest">Newest</option>
              <option value="low">Price: low to high</option><option value="high">Price: high to low</option>
            </select>
          </div>
        </div>
        <div class="chips" id="chips" role="group" aria-label="Category"></div>
        <div class="result-count" id="resultCount" aria-live="polite"></div>
        <div class="row g-3" id="exploreGrid"></div>
        <nav id="pager" aria-label="Pages"></nav>
      </div>
      <footer data-slot="footer"></footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data/mock.js"></script>
  <script src="../assets/js/lz.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/courses.js"></script>
</body>
</html>
