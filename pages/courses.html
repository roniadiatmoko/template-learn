<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses — Learnzie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-skin.css" rel="stylesheet">
  <link href="../assets/css/courses.css" rel="stylesheet">
  <script src="../assets/js/theme-init.js"></script>
</head>
<body data-page="courses" data-title="Courses" data-root="../">
  <div class="app-shell no-right">
    <aside data-slot="sidebar"></aside>
    <main class="app-main">
      <header data-slot="header"></header>
      <div class="app-content">
        <div class="toolbar">
          <ul class="nav nav-pills" id="myTabs">
            <li class="nav-item"><button class="nav-link active" data-tab="progress" type="button">In Progress <span class="badge badge-soft-blue ms-1" data-count="progress">0</span></button></li>
            <li class="nav-item"><button class="nav-link" data-tab="done" type="button">Completed <span class="badge badge-soft-green ms-1" data-count="done">0</span></button></li>
            <li class="nav-item"><button class="nav-link" data-tab="saved" type="button">Saved <span class="badge badge-soft-pink ms-1" data-count="saved">0</span></button></li>
          </ul>
          <div class="search-box"><i class="bi bi-search"></i><input id="myQ" class="form-control" placeholder="Search my courses" aria-label="Search my courses"></div>
        </div>
        <div class="row g-3" id="myGrid" aria-live="polite"></div>
      </div>
      <footer data-slot="footer"></footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data/mock.js"></script>
  <script src="../assets/js/lz.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/courses.js"></script>
</body>
</html>
