<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<body class="public bare" data-layout="public" data-page="coming-soon" data-root="">
  <main>

    <div class="bare-wrap"><div class="bare-card">
      <a class="brand" href="landing.html"><span class="brand-mark"></span>Learnzie</a>
      <h1>Something new is almost here</h1>
      <p>We are building live classes for Learnzie. Leave your email and we will tell you the day it opens.</p>
      <div class="countdown" id="countdown" role="timer" aria-label="Time until launch">
        <div class="cd-box"><b id="cdD">00</b><span>days</span></div><div class="cd-box"><b id="cdH">00</b><span>hours</span></div>
        <div class="cd-box"><b id="cdM">00</b><span>minutes</span></div><div class="cd-box"><b id="cdS">00</b><span>seconds</span></div>
      </div>
      <form id="notifyForm" novalidate>
        <label class="form-label" for="email">Email address</label>
        <div class="input-group"><input id="email" type="email" class="form-control" placeholder="name@email.com" autocomplete="email" required><button class="btn btn-primary" type="submit">Notify me</button><div class="invalid-feedback">Enter a valid email address.</div></div>
      </form>
      <p class="alert alert-success mb-0" id="notifyDone" role="status" hidden></p>
      <div class="bare-foot"><a href="landing.html"><i class="bi bi-arrow-left me-1"></i>Back to the home page</a></div>
    </div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
